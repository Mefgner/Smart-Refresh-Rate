ShortDescription: Automatically switches display refresh rate on AC/battery power changes.
Description: |
  Smart Refresh Rate is a lightweight Windows tray utility that switches each
  monitor's refresh rate when AC power is plugged or unplugged. It polls the
  power state every few seconds, applies per-monitor performance/powersave
  modes from %LOCALAPPDATA%\SRR\config.json, lives in the system tray with
  pause/reload controls, and restores defaults on exit. Packaged as a single
  portable SRR.exe (PyInstaller onefile); on first run it self-installs to
  %LOCALAPPDATA%\SRR, adds an HKCU Run autostart entry and a Start Menu
  shortcut. Supports --uninstall, --help, --version and --config.
